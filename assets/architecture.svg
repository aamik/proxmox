<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-label="Proxmox homelab and local AI architecture">
  <defs>
    <style>
      .bg { fill: #0b1020; }
      .frame { fill: #111827; stroke: #334155; stroke-width: 2; rx: 24; ry: 24; }
      .lane { fill: #0f172a; stroke: #1f2937; stroke-width: 2; rx: 18; ry: 18; }
      .panel { fill: #111827; stroke: #475569; stroke-width: 2; rx: 18; ry: 18; }
      .service { fill: #1f2937; stroke: #94a3b8; stroke-width: 2; rx: 16; ry: 16; }
      .active { fill: #083344; stroke: #22d3ee; stroke-width: 2; rx: 16; ry: 16; }
      .infra { fill: #111827; stroke: #a78bfa; stroke-width: 2.5; rx: 18; ry: 18; }
      .popos { fill: #1f140b; stroke: #fb923c; stroke-width: 2.5; rx: 18; ry: 18; }
      .title { fill: #f8fafc; font: 700 34px Inter, ui-sans-serif, system-ui, sans-serif; }
      .subtitle { fill: #cbd5e1; font: 500 17px Inter, ui-sans-serif, system-ui, sans-serif; }
      .header { fill: #e2e8f0; font: 700 22px Inter, ui-sans-serif, system-ui, sans-serif; }
      .label { fill: #e5e7eb; font: 600 18px Inter, ui-sans-serif, system-ui, sans-serif; }
      .small { fill: #cbd5e1; font: 500 15px Inter, ui-sans-serif, system-ui, sans-serif; }
      .tiny { fill: #94a3b8; font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; }
      .line { stroke: #94a3b8; stroke-width: 3; fill: none; stroke-linecap: round; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="1120"/>
  <rect class="frame" x="34" y="34" width="1732" height="1052"/>
  <text class="title" x="70" y="88">Proxmox Homelab and Local AI Stack</text>
  <rect class="lane" x="70" y="160" width="1660" height="205"/>
  <text class="header" x="100" y="196">Home LAN and maintainer workstation</text>

  <rect class="active" x="100" y="225" width="335" height="126"/>
  <text class="label" x="140" y="258">Windows 11 workstation</text>
  <text class="small" x="140" y="284">WSL2 administration workflow</text>
  <rect class="panel" x="122" y="291" width="291" height="46"/>
  <text class="tiny" x="146" y="309">Maintenance tools</text>
  <text class="tiny" x="146" y="326">shell tooling and notes</text>

  <rect class="active" x="470" y="225" width="285" height="94"/>
  <text class="label" x="510" y="258">LAN clients</text>
  <text class="small" x="510" y="284">phones / laptops / desktops</text>

  <rect class="panel" x="760" y="210" width="540" height="124"/>

  <rect class="infra" x="790" y="225" width="220" height="94"/>
  <text class="label" x="825" y="258">Fritz!Box</text>
  <text class="small" x="825" y="284">DNS, DHCP, routing</text>

  <rect class="infra" x="1045" y="225" width="220" height="94"/>
  <text class="label" x="1080" y="258">NextDNS</text>
  <text class="small" x="1080" y="284">filtered DNS upstream</text>

  <text class="tiny" x="1030" y="220" text-anchor="middle">home LAN core</text>

  <rect class="lane" x="70" y="395" width="1660" height="500"/>
  <text class="header" x="100" y="431">Proxmox VE host</text>

  <rect class="panel" x="100" y="455" width="300" height="118"/>
  <text class="label" x="132" y="492">Proxmox UI / SSH</text>
  <text class="small" x="132" y="518">management plane</text>

  <rect class="panel" x="435" y="455" width="560" height="292"/>
  <text class="label" x="468" y="492">LXC services</text>

  <rect class="service" x="468" y="520" width="160" height="74"/>
  <text class="small" x="508" y="551">LXC</text>
  <text class="tiny" x="488" y="575">Nginx Proxy Manager</text>

  <rect class="service" x="648" y="520" width="160" height="74"/>
  <text class="small" x="688" y="551">LXC</text>
  <text class="tiny" x="694" y="575">Immich</text>

  <rect class="service" x="828" y="520" width="150" height="74"/>
  <text class="small" x="865" y="551">LXC</text>
  <text class="tiny" x="845" y="575">Paperless-ngx</text>

  <rect class="service" x="468" y="626" width="160" height="74"/>
  <text class="small" x="508" y="657">LXC</text>
  <text class="tiny" x="498" y="681">Uptime Kuma</text>

  <rect class="service" x="648" y="626" width="160" height="74"/>
  <text class="small" x="688" y="657">LXC</text>
  <text class="tiny" x="678" y="681">Homepage</text>

  <rect class="service" x="828" y="626" width="150" height="74"/>
  <text class="small" x="865" y="657">LXC</text>
  <text class="tiny" x="868" y="681">Beszel</text>

  <rect class="panel" x="1030" y="455" width="300" height="118"/>
  <text class="label" x="1062" y="492">Virtual machine</text>
  <text class="small" x="1062" y="518">Home Assistant OS</text>
  <text class="tiny" x="1062" y="542">home automation control plane</text>

  <rect class="panel" x="1030" y="606" width="300" height="118"/>
  <text class="label" x="1062" y="643">Frigate NVR</text>
  <text class="small" x="1062" y="669">camera recording and detection</text>
  <text class="tiny" x="1062" y="693">feeds the home automation layer</text>

  <rect class="infra" x="1360" y="455" width="315" height="269"/>
  <text class="label" x="1400" y="492">ZFS mirrored storage</text>
  <text class="small" x="1400" y="518">2x Samsung 870 QVO mirror</text>
  <text class="tiny" x="1400" y="548">Primary storage</text>
  <text class="tiny" x="1400" y="574">No active L2ARC or SLOG</text>
  <text class="tiny" x="1400" y="600">QLC longevity tuned</text>
  <text class="tiny" x="1400" y="626">Mirror health continuously monitored</text>

  <path class="line" d="M1030 334 L1030 360 L90 360"/>
  <path class="line" d="M268 351 L268 360 L90 360"/>
  <path class="line" d="M613 319 L613 360 L90 360"/>
  <path class="line" d="M90 360 L90 985 L370 985"/>

  <path class="line" d="M400 514 L435 514"/>
  <path class="line" d="M995 560 L1030 560"/>
  <path class="line" d="M995 673 L1030 673"/>
  <path class="line" d="M1330 514 L1360 514"/>
  <path class="line" d="M1330 665 L1360 665"/>

  <path class="line" d="M1182 574 L1182 606"/>

  <rect class="popos" x="100" y="925" width="540" height="120"/>
  <text class="label" x="135" y="959">Pop!_OS media PC</text>
  <text class="small" x="135" y="985">Gemma 4 via Ollama</text>
  <text class="tiny" x="135" y="1008">Open WebUI + SearXNG, local Gemma4 served to LAN</text>
</svg>
