<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1340 1015" role="img" aria-labelledby="title desc">
<title id="title">Proxmox homelab architecture</title>
<desc id="desc">Windows and WSL administer a Proxmox host and other LAN devices. Separate storage paths handle production, Windows backups and removable recovery. Dotted connections are planned.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#486789"/></marker><marker id="ai-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#578d76"/></marker></defs>
<style>
