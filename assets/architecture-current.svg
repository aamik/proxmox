<g><rect x="50" y="125" width="275" height="130" rx="10" fill="#fff" stroke="#829bb6"/><text class="heading" x="65" y="150">Windows 11 / WSL2</text><text class="detail" x="65" y="171">Main admin and local AI node</text><text class="detail" x="65" y="192">Zsh · Codex · OpenCode · llama.cpp</text><text class="detail" x="65" y="213">CUDA: RTX 3090 · 24 GB VRAM</text><text class="detail" x="65" y="234">Runs quantized 27B dense models</text></g>
<g><rect x="50" y="330" width="275" height="170" rx="10" fill="#fff" stroke="#829bb6"/><text class="heading" x="65" y="355">LAN clients &amp; devices</text><text class="detail" x="65" y="376">Zenbook · Linux Mint</text><text class="detail" x="65" y="397">MSI Modern 14 · Omarchy</text><text class="detail" x="65" y="418">Raspberry Pi 3B · dashboard</text></g>
