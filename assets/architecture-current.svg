<g><rect x="1000" y="470" width="290" height="100" rx="10" fill="#fff" stroke="#829bb6"/><text class="heading" x="1015" y="495">Offline recovery drive</text><text class="detail" x="1015" y="516">Encrypted Restic backup</text><text class="detail" x="1015" y="537">Selected Proxmox recovery data</text></g>
<g><rect x="1000" y="625" width="290" height="92" rx="10" fill="#fff8e8" stroke="#977329" stroke-dasharray="3 6"/><text class="heading" x="1015" y="650">Proxmox Backup Server</text><text class="detail" x="1015" y="671">Optional guest backup target</text><text class="detail" x="1015" y="692">Placement undecided</text></g>
